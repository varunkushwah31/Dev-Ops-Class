name: Nightly HouseKeeper

on:
    schedule:
        - cron: '0 2 * * *' # Runs every day at 2 AM UTC
    workflow_dispatch:

jobs:
    cleanup:
        runs-on: ubuntu-latest
        steps:
            - name: Print current date and time
              run : echo date
            - name: start cleanup
              run: echo "Running nightly cleanup tasks..."
            - name: Finish housekeeping
              run: echo "Nightly housekeeping tasks completed successfully"