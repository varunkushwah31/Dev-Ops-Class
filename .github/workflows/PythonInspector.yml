name: Python Inspector
on:
    push:
    workflow_dispatch:
jobs:
    inspect:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            - name: Print Python version
              run: python --version
            - name: Print pip version
              run: pip --version
            - name: Locate python binary
              run: which python
            - name: Finish Inspection work
              run: echo "Python Inspector workflow completed successfully"